[pytest]
markers =
    smoke:      Базовые проверки работоспособности — каждый метод отвечает (< 30s)
    e2e:        Сквозной флоу за одного пользователя, один тест на пользователя
    critical:   Бизнес-критичные сценарии
    negative:   Негативные сценарии и обработка ошибок
    slow:       Тесты дольше 10 секунд
    regression: Широкое покрытие всех методов и вариаций (позитив/границы/негатив)

addopts = --tb=short -p no:warnings

filterwarnings =
    ignore::DeprecationWarning
